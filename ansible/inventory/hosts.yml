---
# Unified Nix Configuration - Ansible Inventory
# All hosts managed by this flake repository

all:
  vars:
    ansible_user: deepwatrcreatur
    flake_repo_path: ~/flakes/unified-nix-configuration
    # For hosts where repo is elsewhere
    # flake_repo_path_override: /path/to/repo

  children:
    # NixOS hosts - use nixos-rebuild switch
    nixos:
      hosts:
        # Baremetal binary cache, builder, Niri/Noctalia desktop, and local inference
        emerald:
          ansible_host: 10.10.11.55
          ansible_user: root
          flake_target: emerald

        # Baremetal COSMIC desktop workstation
        phoenix:
          ansible_host: 10.10.11.92
          flake_target: phoenix

        # Baremetal router running router-router dendritic aspect
        router:
          ansible_host: 10.10.10.1
          # Management interface fallback: 192.168.100.100
          flake_target: router

        router-backup:
          ansible_host: 192.168.100.99
          flake_target: router-backup

        # Core services and applications
        homeserver:
          ansible_host: 10.10.11.69
          flake_target: homeserver

        authentik-host:
          ansible_host: 10.10.11.70
          flake_target: authentik-host

        vaglio:
          ansible_host: 10.10.11.71
          flake_target: vaglio

        rustdesk:
          ansible_host: 10.10.11.68
          ansible_user: root
          flake_target: rustdesk

        podman:
          ansible_host: 10.10.11.84
          flake_target: podman

        workstation:
          ansible_host: 10.10.11.73
          flake_target: workstation

    # Binary cache group (emerald replaces decommissioned attic-cache LXC 555001)
    cache:
      hosts:
        emerald:

    # Darwin hosts - use darwin-rebuild switch
    darwin:
      hosts:
        macminim4:
          ansible_host: macminim4
          flake_target: macminim4
        # hackintosh is archived (see den/inventory/darwin.nix)

    # Proxmox hosts - home-manager only (root user)
    proxmox:
      vars:
        ansible_user: root
        flake_repo_path: /root/flakes/unified-nix-configuration
        home_manager_target: proxmox-root
      hosts:
        pve-elitedesk:
          ansible_host: 10.10.11.44
        pve-lattitude:
          ansible_host: 10.10.11.47
        pve-rog:
          ansible_host: 10.10.11.53
        pve-strix:
          ansible_host: 10.10.11.57
        pve-z170:
          ansible_host: 10.10.11.59

    # Groupings for rebuild types
    needs_nixos_rebuild:
      children:
        nixos:

    needs_darwin_rebuild:
      children:
        darwin:

    needs_home_manager:
      children:
        proxmox:
